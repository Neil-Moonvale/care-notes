name: Publish community preview

on:
  push:
    branches: [feature/evidence-revision-core]
    paths:
      - .github/workflows/pages.yml
      - downloads/**
      - docs/releases/**
      - scripts/verify-distribution.py
      - scripts/publish-preview.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: care-notes-public-preview
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Verify APK and stage matching public web files
        run: python scripts/verify-distribution.py --web-output build/public-demo
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/public-demo

  web:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy matching web demo
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish verified APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-preview.mjs

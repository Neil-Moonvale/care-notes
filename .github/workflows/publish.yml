name: Publish release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish.yml
      - downloads/**
      - docs/releases/**
      - scripts/verify-distribution.py
      - scripts/publish-preview.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: care-notes-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      signed_distribution: ${{ steps.distribution.outputs.present }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Check whether this version has a signed distribution
        id: distribution
        run: |
          node --input-type=module - <<'JS' >> "$GITHUB_OUTPUT"
          import {existsSync, readFileSync} from 'node:fs';
          const {version} = JSON.parse(readFileSync('package.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+$/.test(version)) throw Error('Invalid version');
          console.log('present=' + existsSync(`downloads/Care-Notes-${version}.apk`));
          JS
      - name: Verify the distributed APK against source
        if: steps.distribution.outputs.present == 'true'
        run: python scripts/verify-distribution.py

  release:
    needs: verify
    if: needs.verify.outputs.signed_distribution == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish verified APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-preview.mjs
